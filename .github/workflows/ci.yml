name: CI
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci
  IS_TEST: true

jobs:
  slither:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          submodules: recursive

      - name: Run Slither
        id: slither
        continue-on-error: true
        uses: crytic/slither-action@b52cc1cbfee9ca3e8722dd5224299d16c9a6b80f #v0.4.2
        with:
          target: "."
          solc-version: "0.8.33"
          sarif: "slither-results.sarif"
          fail-on: all
  
      - name: Upload Slither SARIF to Code Scanning
        if: (success() || failure()) && hashFiles('slither-results.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: github/codeql-action/upload-sarif@32f7c15247fa6542dc765bd40f6a15dc2caeed89 # v4.31.2
        with:
          sarif_file: slither-results.sarif
  
      - name: Fail if Slither reported findings
        if: steps.slither.outcome == 'failure'
        run: |
          echo "::error::Slither reported findings (see job log; SARIF uploaded when available)."
          exit 1

  forge-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          submodules: recursive

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24.14.0"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@8789b3e21e6c11b2697f5eb56eddae542f746c10 # v1.7.0
        with:
          version: v1.3.1

      - name: Check Solidity formatting
        run: forge fmt --check

      - name: Install Open Zeppelin Upgrades Core
        run: npm install -g @openzeppelin/upgrades-core@1.44.2

      - name: Run tests
        # we run all tests in CI while in local we run only the tests that are relevant
        run: forge test -vvv

      - name: Simulate deployment
        run: bash shell/script/deploy/simulate-deploy.sh

      - name: Run user-take-flow
        run: bash shell/script/integration-test/user-take-flow.sh

      - name: Run operator-take-flow
        run: bash shell/script/integration-test/operator-take-flow.sh

      - name: Run operator-won-flow
        run: bash shell/script/integration-test/operator-won-flow.sh

      - name: Run reject-pegin-flow
        run: bash shell/script/integration-test/reject-pegin-flow.sh

      - name: Run user-reimbursement-flow
        run: bash shell/script/integration-test/user-reimbursement-flow.sh
