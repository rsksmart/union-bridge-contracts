name: CI
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci
  IS_TEST: true

jobs:
  run-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0
        with:
          submodules: recursive

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.14.0"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@de808b1eea699e761c404bda44ba8f21aba30b2c # v1.3.1
        with:
          version: v1.3.1

      - name: Install Open Zeppelin Upgrades Core
        run: npm install -g @openzeppelin/upgrades-core@1.44.2

      - name: Run tests
        # we run all tests in CI while in local we run only the tests that are relevant
        run: forge test -vvv

      - name: Simulate deployment
        run: bash shell/script/deploy/simulate-deploy.sh

      - name: Run user-take-flow
        run: bash shell/script/integration-test/user-take-flow.sh

      - name: Run operator-take-flow
        run: bash shell/script/integration-test/operator-take-flow.sh

      - name: Run operator-won-flow
        run: bash shell/script/integration-test/operator-won-flow.sh

      - name: Run reject-pegin-flow
        run: bash shell/script/integration-test/reject-pegin-flow.sh

      - name: Run user-reimbursement-flow
        run: bash shell/script/integration-test/user-reimbursement-flow.sh
