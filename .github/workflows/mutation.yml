name: Mutation testing

on:
  pull_request:
  workflow_dispatch:
    inputs:
      targets:
        description: "Space-separated contracts to mutate (defaults to the changed ones)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci
  IS_TEST: true

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          # Full history so the base ref is available to `git diff`.
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Drift guard. Advisory like the rest of the job: remove continue-on-error
      # to make an unmapped contract block the PR.
      - name: Check mutation scope
        id: scope
        continue-on-error: true
        run: ./shell/mutation/check-scope.sh

      - name: Report scope drift
        if: steps.scope.outcome == 'failure'
        run: |
          {
            echo "### Mutation scope drift"
            echo
            echo "\`mewt.toml\` no longer matches the contracts under \`src/\`."
            echo "Contracts without a \`[[per_target]]\` mapping are skipped by mutation testing."
            echo
            echo "Run \`make mutate-scope\` locally for details."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve targets
        id: targets
        env:
          INPUT_TARGETS: ${{ github.event.inputs.targets }}
          HEAD_BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$INPUT_TARGETS" ]; then
            # shellcheck disable=SC2086
            targets="$(printf '%s\n' $INPUT_TARGETS | python3 shell/mutation/scope.py filter)"
          else
            targets="$(./shell/mutation/changed-contracts.sh "origin/${HEAD_BASE_REF:-main}")"
          fi

          {
            echo "targets<<EOF"
            echo "$targets"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ -z "$targets" ]; then
            echo "has_targets=false" >> "$GITHUB_OUTPUT"
            echo "No contracts in mutation scope changed; skipping." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "has_targets=true" >> "$GITHUB_OUTPUT"

          # A single contract can produce a few hundred mutants, and every one
          # of them recompiles. More than one contract does not fit in the job
          # timeout, so drop to high-severity mutations (slugs resolved from
          # `mewt print mutations` after mewt is installed) rather than
          # running out the clock.
          count="$(printf '%s\n' "$targets" | wc -l | tr -d ' ')"
          echo "count=$count" >> "$GITHUB_OUTPUT"

          if [ "$count" -gt 1 ]; then
            echo "high_severity_only=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Mutation testing scope reduced"
              echo
              echo "This PR changes **$count** contracts in mutation scope."
              echo "A full campaign on more than one contract does not fit in the job timeout,"
              echo "so this run is limited to **high severity mutations only**."
              echo "Slugs are taken from \`mewt print mutations --language solidity\`."
              echo
              echo "For a full campaign on a single contract, run it locally:"
              echo '```'
              printf '%s\n' "$targets" | sed 's|^|make mutate-file FILE=|'
              echo '```'
              echo
              echo "To mutate every allowlisted contract locally:"
              echo '```'
              echo "make mutate-all"
              echo '```'
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "high_severity_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install jq
        if: steps.targets.outputs.has_targets == 'true'
        run: sudo apt-get update && sudo apt-get install -y jq

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.targets.outputs.has_targets == 'true'
        with:
          node-version: "24.14.0"

      - name: Install Foundry
        if: steps.targets.outputs.has_targets == 'true'
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.3.1

      - name: Install Open Zeppelin Upgrades Core
        if: steps.targets.outputs.has_targets == 'true'
        run: npm install -g @openzeppelin/upgrades-core@1.44.2

      - name: Resolve pinned mewt version
        if: steps.targets.outputs.has_targets == 'true'
        id: mewt-version
        run: echo "tag=$(./shell/mutation/install-mewt.sh --version)" >> "$GITHUB_OUTPUT"

      - name: Cache mewt
        if: steps.targets.outputs.has_targets == 'true'
        id: mewt-cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.local/bin/mewt
          key: mewt-${{ runner.os }}-${{ steps.mewt-version.outputs.tag }}-${{ hashFiles('shell/mutation/install-mewt.sh') }}

      - name: Install mewt
        if: steps.targets.outputs.has_targets == 'true' && steps.mewt-cache.outputs.cache-hit != 'true'
        run: ./shell/mutation/install-mewt.sh

      - name: Add mewt to PATH
        if: steps.targets.outputs.has_targets == 'true'
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Resolve mutation slugs
        if: steps.targets.outputs.has_targets == 'true'
        id: mutations
        env:
          HIGH_SEVERITY_ONLY: ${{ steps.targets.outputs.high_severity_only }}
        run: |
          if [ "$HIGH_SEVERITY_ONLY" = "true" ]; then
            slugs="$(./shell/mutation/high-severity-mutations.sh)"
            echo "High-severity Solidity mutations: $slugs"
            echo "mutations=$slugs" >> "$GITHUB_OUTPUT"
          else
            echo "mutations=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run mutation campaign
        if: steps.targets.outputs.has_targets == 'true'
        env:
          TARGETS: ${{ steps.targets.outputs.targets }}
          MUTATIONS: ${{ steps.mutations.outputs.mutations }}
        run: |
          if [ -n "$MUTATIONS" ]; then
            set -- --mutations "$MUTATIONS"
          else
            set --
          fi
          # shellcheck disable=SC2086
          mewt run "$@" $TARGETS

      - name: Summarize results
        if: steps.targets.outputs.has_targets == 'true'
        env:
          TARGETS: ${{ steps.targets.outputs.targets }}
          MUTATIONS: ${{ steps.mutations.outputs.mutations }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        run: |
          mewt status --format json > mutation-status.json

          {
            echo "### Mutation testing"
            echo
            echo "**Contracts mutated:**"
            printf '%s\n' "$TARGETS" | sed 's|^|- `|; s|$|`|'
            echo
            if [ -n "$MUTATIONS" ]; then
              echo "**Mutations executed:** \`$MUTATIONS\` only (high severity). Medium/low rates below are \`n/a\` because those mutants were not run."
            else
              echo "**Mutations executed:** all severities (default mewt set for Solidity)."
            fi
            echo
            echo "| Contract | Mutants | Tested | Caught | Uncaught | Timeout | High | Medium | Low |"
            echo "| --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |"
            jq -r '
              def pct: if . == null then "n/a" else "\(. * 10 | round / 10)%" end;
              .targets[]
              | "| \(.path) | \(.total_mutants) | \(.tested) | \(.caught) | \(.uncaught) | \(.timeout) "
                + "| \(.high_catch_rate | pct) | \(.medium_catch_rate | pct) | \(.low_catch_rate | pct) |"
            ' mutation-status.json
            echo
            jq -r '
              def pct: if . == null then "n/a" else "\(. * 10 | round / 10)%" end;
              .campaign
              | "Tested \(.tested) of \(.total_mutants) mutants: \(.caught) caught, "
                + "\(.uncaught) uncaught, \(.timeout) timed out "
                + "(catch rate high \(.high_catch_rate | pct), medium \(.medium_catch_rate | pct), "
                + "low \(.low_catch_rate | pct))."
            ' mutation-status.json
            echo
            echo "Advisory only: surviving mutants do not fail this job."
            if [ "$IS_FORK_PR" = "true" ]; then
              echo "SARIF upload is skipped for forked PRs."
            else
              echo "Survivors are annotated on the PR via SARIF (Code Scanning) when upload is permitted."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate SARIF
        if: steps.targets.outputs.has_targets == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        run: mewt results --format sarif > mutation.sarif

      - name: Upload SARIF file
        if: steps.targets.outputs.has_targets == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: github/codeql-action/upload-sarif@32f7c15247fa6542dc765bd40f6a15dc2caeed89 # v4.31.2
        with:
          sarif_file: mutation.sarif
          category: mutation-testing
