name: Mutation testing

# Advisory only: this workflow reports surviving mutants but never fails a PR.
# `mewt run` exits 0 even when mutants survive, so any gating would have to be
# built on top of `mewt status --format json` deliberately.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      targets:
        description: "Space-separated contracts to mutate (defaults to the changed ones)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write
    env:
      # Pinned mewt release (kept in sync with Makefile's MEWT_VERSION) so a new
      # upstream release can't run in CI without a reviewed bump here. The
      # installer script is itself version-pinned (its download URLs and
      # checksums are baked in at publish time), so fetching it from this
      # specific tag - not /latest/ - is what makes the install reproducible,
      # and using the same value for the cache key rules out a mismatch
      # between what got cached and what gets installed.
      MEWT_VERSION: "4.0.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          submodules: recursive
          # Full history so the base ref is available to `git diff`.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Drift guard. Advisory like the rest of the job: remove continue-on-error
      # to make an unmapped contract block the PR.
      - name: Check mutation scope
        id: scope
        continue-on-error: true
        run: ./shell/mutation/check-scope.sh

      - name: Report scope drift
        if: steps.scope.outcome == 'failure'
        run: |
          {
            echo "### Mutation scope drift"
            echo
            echo "\`mewt.toml\` no longer matches the contracts under \`src/\`."
            echo "Contracts without a \`[[per_target]]\` mapping are skipped by mutation testing."
            echo
            echo "Run \`make mutate-scope\` locally for details."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve targets
        id: targets
        env:
          # Passed through the environment rather than interpolated into the
          # script, so neither input can inject shell.
          INPUT_TARGETS: ${{ github.event.inputs.targets }}
          # Empty on workflow_dispatch, where there is no PR to diff against.
          HEAD_BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$INPUT_TARGETS" ]; then
            # Word splitting on $INPUT_TARGETS is intended (it's a space-separated
            # list); pathname expansion is not, so globbing is disabled first.
            set -f
            # shellcheck disable=SC2086
            targets="$(printf '%s\n' $INPUT_TARGETS | python3 shell/mutation/scope.py filter)"
            set +f
          else
            targets="$(./shell/mutation/changed-contracts.sh "origin/${HEAD_BASE_REF:-main}")"
          fi

          {
            echo "targets<<EOF"
            echo "$targets"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ -z "$targets" ]; then
            echo "has_targets=false" >> "$GITHUB_OUTPUT"
            echo "No contracts in mutation scope changed; skipping." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "has_targets=true" >> "$GITHUB_OUTPUT"

          # A single contract can produce a few hundred mutants, and every one
          # of them recompiles. More than one contract does not fit in the job
          # timeout, so drop to high severity (ER is the only high-severity
          # Solidity mutation) and say so rather than running out the clock.
          count="$(printf '%s\n' "$targets" | wc -l | tr -d ' ')"
          echo "count=$count" >> "$GITHUB_OUTPUT"

          if [ "$count" -gt 1 ]; then
            echo "mutations=ER" >> "$GITHUB_OUTPUT"
            {
              echo "### Mutation testing scope reduced"
              echo
              echo "This PR changes **$count** contracts in mutation scope."
              echo "A full campaign on more than one contract does not fit in the job timeout,"
              echo "so this run is limited to **high severity (ER) mutations only**."
              echo
              echo "For a full campaign on a single contract, run it locally:"
              echo '```'
              printf '%s\n' "$targets" | sed 's|^|make mutate-file FILE=|'
              echo '```'
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "mutations=" >> "$GITHUB_OUTPUT"
          fi

      - name: Install jq
        if: steps.targets.outputs.has_targets == 'true'
        run: sudo apt-get update && sudo apt-get install -y jq

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.targets.outputs.has_targets == 'true'
        with:
          node-version: "24.14.0"

      - name: Install Foundry
        if: steps.targets.outputs.has_targets == 'true'
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.3.1

      # Most mapped test suites deploy through DeployScript, which validates
      # upgradeability via Upgrades.deployUUPSProxy - this global package is
      # what makes that validation possible, same as the ci.yml forge-test job.
      - name: Install Open Zeppelin Upgrades Core
        if: steps.targets.outputs.has_targets == 'true'
        run: npm install -g @openzeppelin/upgrades-core@1.44.2

      - name: Cache mewt
        if: steps.targets.outputs.has_targets == 'true'
        id: mewt-cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.local/bin/mewt
          key: mewt-${{ runner.os }}-${{ env.MEWT_VERSION }}

      - name: Install mewt
        if: steps.targets.outputs.has_targets == 'true' && steps.mewt-cache.outputs.cache-hit != 'true'
        run: curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/trailofbits/mewt/releases/download/v${MEWT_VERSION}/mewt-installer.sh" | sh

      - name: Add mewt to PATH
        if: steps.targets.outputs.has_targets == 'true'
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Targets are always passed explicitly, which replaces [targets].include
      # for this invocation. They are already intersected with the allowlist.
      #
      # continue-on-error is deliberate: this step's exit code conflates two
      # very different things. Surviving mutants alone never make `mewt run`
      # exit non-zero (that's the "advisory only" model), so a failure here
      # means the run itself broke - e.g. a failing baseline test, or mewt
      # crashing. The steps below key off `outcome` to tell those apart from
      # a clean run instead of publishing a misleadingly "green" result from a
      # broken or partial campaign.
      - name: Run mutation campaign
        id: campaign
        if: steps.targets.outputs.has_targets == 'true'
        continue-on-error: true
        env:
          TARGETS: ${{ steps.targets.outputs.targets }}
          MUTATIONS: ${{ steps.targets.outputs.mutations }}
        run: |
          if [ -n "$MUTATIONS" ]; then
            set -- --mutations "$MUTATIONS"
          else
            set --
          fi
          # Word splitting is intended: TARGETS is a newline-separated path list.
          # shellcheck disable=SC2086
          mewt run "$@" $TARGETS

      - name: Report campaign failure
        if: steps.campaign.outcome == 'failure'
        run: |
          {
            echo "### Mutation campaign failed"
            echo
            echo "\`mewt run\` did not complete successfully - this points at a broken"
            echo "baseline (the allowlisted test command fails even without mutations)"
            echo "or a tooling error, not at surviving mutants."
            echo
            echo "See the **Run mutation campaign** step log for details. No mutant"
            echo "results are available for this run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize results
        # Gated on the campaign's own success, not just has_targets: a failed
        # or partial campaign must not be read by `mewt status` and published
        # as if it were a clean result.
        if: steps.campaign.outcome == 'success'
        continue-on-error: true
        env:
          TARGETS: ${{ steps.targets.outputs.targets }}
          MUTATIONS: ${{ steps.targets.outputs.mutations }}
        run: |
          mewt status --format json > mutation-status.json

          {
            echo "### Mutation testing"
            echo
            echo "**Contracts mutated:**"
            printf '%s\n' "$TARGETS" | sed 's|^|- `|; s|$|`|'
            echo
            if [ -n "$MUTATIONS" ]; then
              echo "**Mutations executed:** \`$MUTATIONS\` only (high severity). Medium/low rates below are \`n/a\` because those mutants were not run."
            else
              echo "**Mutations executed:** all severities (default mewt set for Solidity)."
            fi
            echo
            echo "| Contract | Mutants | Tested | Caught | Uncaught | Timeout | High | Medium | Low |"
            echo "| --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |"
            jq -r '
              def pct: if . == null then "n/a" else "\(. * 10 | round / 10)%" end;
              .targets[]
              | "| \(.path) | \(.total_mutants) | \(.tested) | \(.caught) | \(.uncaught) | \(.timeout) "
                + "| \(.high_catch_rate | pct) | \(.medium_catch_rate | pct) | \(.low_catch_rate | pct) |"
            ' mutation-status.json
            echo
            jq -r '
              def pct: if . == null then "n/a" else "\(. * 10 | round / 10)%" end;
              .campaign
              | "Tested \(.tested) of \(.total_mutants) mutants: \(.caught) caught, "
                + "\(.uncaught) uncaught, \(.timeout) timed out "
                + "(catch rate high \(.high_catch_rate | pct), medium \(.medium_catch_rate | pct), "
                + "low \(.low_catch_rate | pct))."
            ' mutation-status.json
            echo
            echo "Advisory only: surviving mutants do not fail this job."
            echo "Survivors are annotated on the PR via SARIF (Code Scanning)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate SARIF
        id: sarif
        # Same reasoning as "Summarize results": a failed/partial campaign
        # must not be read by `mewt results` and published as a result.
        if: steps.campaign.outcome == 'success'
        continue-on-error: true
        run: mewt results --format sarif > mutation.sarif

      - name: Upload SARIF file
        # `hashFiles` only confirms the redirect created a file, which happens
        # even when `mewt results` itself fails - so gate on this step's own
        # outcome instead of (or as well as) file presence, otherwise an
        # empty/invalid mutation.sarif can reach upload-sarif and fail this
        # supposedly advisory job when it fails to parse.
        if: steps.sarif.outcome == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        # This action itself is not advisory by default: a Code Scanning
        # permission, availability, or upload error would otherwise fail the
        # job despite everything upstream being designed not to.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@32f7c15247fa6542dc765bd40f6a15dc2caeed89 # v4.31.2
        with:
          sarif_file: mutation.sarif
          category: mutation-testing
